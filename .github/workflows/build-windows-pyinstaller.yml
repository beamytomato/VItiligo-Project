name: Build Windows PyInstaller App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python

      - name: Build Windows app
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name StableLandmarkGUI `
            --hidden-import stable_landmark_labeler_v2 `
            --paths stable_landmark_project `
            --add-data "stable_landmark_project\patient461_known_landmarks.json;." `
            stable_landmark_project\stable_landmark_gui.py

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StableLandmarkGUI -DestinationPath StableLandmarkGUI-windows.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: StableLandmarkGUI-windows
          path: StableLandmarkGUI-windows.zip
